<!DOCTYPE html>
<html>
<head>
    <title>Enhanced Task Manager (HTML Only)</title>
</head>
<body>

    <h1>Enhanced Task Manager</h1>

    <p>A simple task manager created using only HTML. Check tasks, type new ones, and organize them with priority, category, and due dates.</p>

    <h3>Your Tasks:</h3>

    <table border="1" cellpadding="8">
        <tr>
            <th>Done</th>
            <th>Task</th>
            <th>Priority</th>
            <th>Category</th>
            <th>Due Date</th>
            <th>Notes</th>
        </tr>

        <tr>
            <td><input type="checkbox"></td>
            <td>Study for 1 hour</td>
            <td>
                <select>
                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>
                </select>
            </td>
            <td>
                <select>
                    <option>Study</option>
                    <option>Work</option>
                    <option>Personal</option>
                </select>
            </td>
            <td><input type="date"></td>
            <td><input type="text" placeholder="Add notes"></td>
        </tr>

        <tr>
            <td><input type="checkbox"></td>
            <td>Read 5 pages</td>
            <td>
                <select>
                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>
                </select>
            </td>
            <td>
                <select>
                    <option>Study</option>
                    <option>Work</option>
                    <option>Personal</option>
                </select>
            </td>
            <td><input type="date"></td>
            <td><input type="text" placeholder="Add notes"></td>
        </tr>

        <tr>
            <td><input type="checkbox"></td>
            <td>Practice typing</td>
            <td>
                <select>
                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>
                </select>
            </td>
            <td>
                <select>
                    <option>Study</option>
                    <option>Work</option>
                    <option>Personal</option>
                </select>
            </td>
            <td><input type="date"></td>
            <td><input type="text" placeholder="Add notes"></td>
        </tr>

        <tr>
            <td><input type="checkbox"></td>
            <td><input type="text" placeholder="Write a new task"></td>
            <td>
                <select>
                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>
                </select>
            </td>
            <td>
                <select>
                    <option>Study</option>
                    <option>Work</option>
                    <option>Personal</option>
                </select>
            </td>
            <td><input type="date"></td>
            <td><input type="text" placeholder="Add notes"></td>
        </tr>
    </table>

</body>
</html>
